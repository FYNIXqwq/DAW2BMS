[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "daw2bms"
version = "0.8.0"
description = "FLP and Ableton ALS to MIDI, isolated keysounds and BMS test charts"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.24,<3", "soundfile>=0.12,<1"]
test = ["mido>=1.3,<2"]
ableton = ["numpy>=1.24,<3", "soundfile>=0.12,<1", "PyAutoGUI>=0.9.54,<1; sys_platform == 'win32'", "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'", "pyperclip>=1.9,<2; sys_platform == 'win32'"]
gui = ["PyQt6>=6.6,<7", "numpy>=1.24,<3", "soundfile>=0.12,<1"]

[project.scripts]
daw2bms = "daw2bms.__main__:main"

[project.gui-scripts]
daw2bms-gui = "daw2bms.gui:main"

[tool.setuptools.packages.find]
include = ["daw2bms*"]

[tool.setuptools.package-data]
"daw2bms.locales" = ["*.json"]
