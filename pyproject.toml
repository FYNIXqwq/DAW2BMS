[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daw2bms"
version = "0.3.0"
description = "FLP extraction, adaptive keysound cutting and BMS test-chart export"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.24,<3", "soundfile>=0.12,<1"]
test = ["mido>=1.3,<2"]

[project.scripts]
daw2bms = "daw2bms.__main__:main"

[tool.setuptools.packages.find]
include = ["daw2bms*"]
