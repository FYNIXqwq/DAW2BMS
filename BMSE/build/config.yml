version: '3'
info:
  companyName: BMSE contributors
  productName: BMx Sequence Editor
  productIdentifier: org.bmse.editor
  description: Web and Wails 3 rewrite of BMSE
  copyright: DAW2BMS contributors; original BMSE Hayana/UCN-Soft, Drossel Studio, Nekokan_Server. See NOTICE.
  version: 3.0.0
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, frontend, bin, build]
    file: ['*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task frontend:dev
      type: background
    - cmd: wails3 task run
      type: primary
